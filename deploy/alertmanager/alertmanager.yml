global:
  resolve_timeout: 5m

route:
  receiver: obsly-default
  group_by: ["alertname", "fleet"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: obsly-critical
      repeat_interval: 1h

receivers:
  - name: obsly-default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#obsly-alerts"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: obsly-critical
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#obsly-alerts-critical"
        send_resolved: true
        title: "[CRITICAL] {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "fleet", "host"]
